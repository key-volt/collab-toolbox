<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Code sandbox</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #141517;
        color: #e8e6e3;
        color-scheme: dark;
        font: 13px ui-sans-serif, system-ui, sans-serif;
      }
      #layout {
        display: flex;
        height: 100%;
      }
      #terminal {
        flex: 1 1 auto;
        min-width: 0;
        padding: 4px 0 0 6px;
      }
      #graphics {
        display: none;
        flex: 0 0 40%;
        min-width: 0;
        overflow: auto;
        border-left: 1px solid #34363c;
        background: #1d1e21;
        padding: 8px;
      }
      #graphics.has-content {
        display: block;
      }
      #graphics img,
      #graphics svg {
        max-width: 100%;
        display: block;
        margin: 0 auto 8px;
      }
    </style>
  </head>
  <body>
    <div id="layout">
      <div id="terminal"></div>
      <div id="graphics"></div>
    </div>
    <script type="module" src="./src/controller.ts"></script>
  </body>
</html>
