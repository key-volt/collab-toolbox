<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Diagram editor</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #f5f0e8;
      }
      /* The editor container is visible and sized from the start — the editor measures
         it during initialization. The overlay covers it until the editor is ready. */
      #drawio-container {
        position: absolute;
        inset: 0;
      }
      #editor-loading {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f0e8;
        color: #6b6156;
        font: 13px ui-sans-serif, system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="drawio-container" class="geEditor"></div>
    <div id="editor-loading">loading the editor…</div>
    <script type="module" src="/src/drawio-entry.ts"></script>
  </body>
</html>
