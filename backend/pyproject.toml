[project]
name = "collab-toolbox"
# Required metadata, but not the product version — this package is never built or published.
# The product version is the VERSION file at the repository root.
version = "0.0.0"
description = "Modular collaboration toolbox"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.0.52",
    "aiosqlite==0.22.1",
    "alembic==1.19.1",
    "argon2-cffi==25.1.0",
    "pyjwt==2.13.0",
    "python-multipart==0.0.32",
    "pycrdt==0.14.3",
    "pycrdt-websocket==0.16.4",
    "defusedxml==0.7.1",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.4",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "A",     # shadowed builtins
    "ASYNC", # blocking calls in async code
    "B",     # bugbear
    "C4",    # comprehensions
    "E",     # pycodestyle
    "F",     # pyflakes
    "I",     # import order
    "N",     # naming
    "RUF",
    "S",     # security
    "SIM",
    "UP",    # pyupgrade
    "W",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"] # tests assert and carry throwaway passwords

[tool.mypy]
python_version = "3.12"
files = ["app", "tests"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["defusedxml", "defusedxml.*", "pycrdt_websocket", "pycrdt_websocket.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
