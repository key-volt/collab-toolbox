name: collab-toolbox

services:
  app:
    image: ${IMAGE}
    restart: unless-stopped
    ports:
      - "${PUBLISH_HTTP:-0.0.0.0:80:8080}"
      - "${PUBLISH_HTTPS:-0.0.0.0:443:8443}"
    env_file: [.env]
    volumes:
      - ./data:/data
    secrets:
      - admin_password
      - jwt_secret

secrets:
  admin_password:
    file: ./secrets/admin_password
  jwt_secret:
    file: ./secrets/jwt_secret
