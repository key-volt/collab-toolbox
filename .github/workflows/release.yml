name: Publish

on:
  push:
    branches: [main, develop]

permissions:
  contents: read
  actions: write # the called workflow reads and writes the build cache

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Two branches, two moving channel tags. The version itself comes from the VERSION file
      # in both cases, so the branch decides only which channel tag moves.
      - name: Publish from main
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          tags: |
            ${{ secrets.DOCKERHUB_IMAGE }}:${{ needs.verify.outputs.version }}
            ${{ secrets.DOCKERHUB_IMAGE }}:latest

      - name: Publish from develop
        if: github.ref == 'refs/heads/develop'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          tags: |
            ${{ secrets.DOCKERHUB_IMAGE }}:${{ needs.verify.outputs.version }}
            ${{ secrets.DOCKERHUB_IMAGE }}:test
