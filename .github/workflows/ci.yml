name: CI

# Pushes to the publishing branches arrive through the publish workflow, which calls this one.
on:
  pull_request:
  workflow_call:
    outputs:
      version:
        description: The product version, read from the VERSION file.
        value: ${{ jobs.version.outputs.number }}

permissions:
  contents: read
  actions: write # the build cache is written through the Actions cache service

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.read.outputs.number }}
    steps:
      - uses: actions/checkout@v7

      # The value itself is free-form. The only constraint applied is what a registry will
      # accept as a tag, so a bad value fails here rather than at the push.
      - name: Read VERSION
        id: read
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ -z "$version" ]; then
            echo "VERSION is empty." >&2
            exit 1
          fi
          if [ "${#version}" -gt 128 ]; then
            echo "VERSION is longer than the 128 characters a tag allows: '$version'" >&2
            exit 1
          fi
          case "$version" in
          [!A-Za-z0-9_]*)
            echo "A tag must start with a letter, digit or underscore: '$version'" >&2
            exit 1
            ;;
          *[!A-Za-z0-9._-]*)
            echo "A tag may only contain letters, digits, '.', '-' and '_': '$version'" >&2
            exit 1
            ;;
          esac
          echo "number=$version" >> "$GITHUB_OUTPUT"
          echo "Version \`$version\`" >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv==0.12.5

      - name: Install dependencies
        run: |
          uv venv
          uv pip install --python .venv/bin/python -r pyproject.toml --extra dev

      # An install that resolves is not yet an install that works: every runtime
      # dependency must actually import, so a gap fails here with its name instead of
      # surfacing later as a crash.
      - name: Verify the environment
        run: >
          .venv/bin/python -c "import aiosqlite, alembic, altcha, argon2, defusedxml,
          fastapi, jwt, pycrdt, pycrdt.websocket, pydantic_settings, python_multipart,
          sqlalchemy, uvicorn"

      - name: Lint
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: Type check
        run: .venv/bin/mypy

      - name: Test
        run: .venv/bin/pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

  image:
    name: Image and browser suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The installer carries its own copy of the compose file so one script is
      # enough on a target machine; this keeps the two copies identical.
      - name: Installer compose matches the shipped compose
        run: sh deploy/setup.sh print-compose | diff - deploy/docker-compose.yml

      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: collab-toolbox:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Brings the stack up through the same compose file a target machine uses, so the
      # routing, headers and volume ownership under test are the ones that ship.
      - name: Prepare a deployment
        working-directory: deploy
        run: |
          mkdir -p data secrets certs
          umask 077
          openssl rand -hex 32 > secrets/jwt_secret
          openssl rand -hex 24 > secrets/admin_password
          grep -vE '^(IMAGE|DOMAIN|ACME_EMAIL|TLS_MODE|BIND_ADDR|HTTP_PORT|PUID|PGID)=' \
            .env.example > .env
          {
            echo "IMAGE=collab-toolbox:ci"
            echo "DOMAIN=localhost"
            echo "ACME_EMAIL=ci@example.invalid"
            echo "TLS_MODE=off"
            echo "BIND_ADDR=127.0.0.1"
            echo "HTTP_PORT=8080"
            echo "PUID=$(id -u)"
            echo "PGID=$(id -g)"
          } >> .env

      - name: Start the stack
        working-directory: deploy
        run: docker compose up -d --wait --wait-timeout 180

      - name: Check ownership of the mounted volume
        working-directory: deploy
        run: |
          expected="$(id -u):$(id -g)"
          for path in data/app.sqlite data/docs data/docs/.trash data/uploads \
                      data/backups data/caddy/data; do
            actual="$(stat -c %u:%g "$path")"
            if [ "$actual" != "$expected" ]; then
              echo "$path is owned by $actual, expected $expected" >&2
              exit 1
            fi
          done

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install the browser suite
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Type check the browser suite
        working-directory: e2e
        run: npm run typecheck

      - name: Run the browser suite
        working-directory: e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
        run: E2E_ADMIN_PASSWORD="$(cat ../deploy/secrets/admin_password)" npm run test

      # hashFiles is empty when the deployment was never prepared (an earlier step
      # failed first); running compose then only adds a second, misleading error.
      - name: Container logs
        if: failure() && hashFiles('deploy/.env') != ''
        working-directory: deploy
        run: docker compose logs --no-color

      - name: Upload the browser report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

      - name: Stop the stack
        if: always() && hashFiles('deploy/.env') != ''
        working-directory: deploy
        run: docker compose down --volumes
